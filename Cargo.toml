[package]
authors = ["Nick Hirakawa <nickhirakawa@gmail.com>"]
edition = "2018"
name = "advent-of-code"
version = "0.1.0"

[dependencies]
ansi_term = "0.12.1"
anyhow = "1.0.89"
bitvec = "1.0.1"
clap = { version = "4.5.20", features = ["cargo"] }
env_logger = "0.11.5"
image = { version = "0.25.5", default-features = false, features = [
    "gif",
    "jpeg",
    "png",
    "rayon",
] }
itertools = "0.13.0"
log = "0.4.22"
md5 = "0.7.0"
multimap = "0.10.0"
multiset = "0.0.5"
nom = "8.0.0"
nom-language = "0.1.0"
petgraph = "0.6.5"
rayon = "1.10.0"
regex = "1.11.0"
serde = "1.0.217"
serde_json = "1.0.134"
uuid = { version = "1.10.0", features = ["serde", "v4"] }
